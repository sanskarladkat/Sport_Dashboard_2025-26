<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Budget & Operations</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/budget_style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header-wrapper">
            <a href="/" class="back-btn">← Back to Home</a>
            <h1 id="budgetTitle">MIT-WPU Sports and Gymkhana 2025-26</h1>
            <div class="year-selector-wrapper">
                <label for="budgetYearSelect" style="font-weight:600; margin-right:8px;">Select Year</label>
                <select id="budgetYearSelect" class="year-select">
                    <option value="budget_2025-26" selected>2025-26</option>
                    <option value="budget_2026-27">2026-27</option>
                </select>
            </div>
        </div>
        
        <!-- KPI Cards -->
        <div class="kpi-section">
            <div class="kpi-card">
                <h4 class="kpi-label">Total Budget</h4>
                <p class="kpi-value" id="kpiTotalBudget">₹ 0</p>
            </div>
            <div class="kpi-card">
                <h4 class="kpi-label">Utilized Budget</h4>
                <p class="kpi-value" id="kpiUtilizedBudget">₹ 0</p>
            </div>
            <div class="kpi-card">
                <h4 class="kpi-label">Remaining Budget</h4>
                <p class="kpi-value" id="kpiRemainingBudget">₹ 0</p>
            </div>
        </div>
        
        <div class="chart-section">
            <h3 class="chart-title">Total Budget Utilization</h3>
            <div id="totalUtilizationChart"></div>
        </div>

        <div class="charts-row">
            <div class="col-small">
                <h3 class="chart-title">Funds Distribution (Category-wise)</h3>
                <div id="budgetPieChart"></div>
            </div>

            <div class="col-large">
                <h3 class="chart-title">Breakdown of Budget Utilization</h3>
                <div id="budgetStackChart"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/budget_script.js') }}"></script>
</body>
</html>
